<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Wooden table — Three.js</title>
  <style>
    html,body { margin:0; width:100%; height:100%; background:#dad8d4; font:13px system-ui,sans-serif; color:#444; }
    #stage { width:100%; height:100%; }
    footer { position:fixed; bottom:22px; left:0; right:0; text-align:center; pointer-events:none; }
    button { pointer-events:auto; margin-left:16px; border:1px solid #aaa; padding:7px 12px; border-radius:20px; color:#444; background:#eee9; cursor:pointer; }
  </style>
</head>
<body>
  <div id="stage" aria-label="Interactive 3D wooden table"></div>
  <footer>Drag to orbit · scroll to zoom <button id="reset">Reset view</button></footer>
  <script type="module">
    import { mountWoodenTable } from './src/wooden-table.js';
    const viewer = mountWoodenTable(document.querySelector('#stage'));
    document.querySelector('#reset').addEventListener('click', viewer.resetCamera);
    window.addEventListener('pagehide', () => viewer.dispose(), { once:true });
  </script>
</body>
</html>
